name: Construire l'application Android
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decompresser le projet
        run: unzip -q cotation-android.zip -d proj
      - name: Installer Capacitor et creer le projet Android
        working-directory: proj
        run: |
          npm install
          npx cap add android
      - name: Ajouter le code natif
        working-directory: proj
        run: |
          D=android/app/src/main/java/com/lemarcbzh/cotation
          mkdir -p $D
          cp native/*.java $D/
          sed -i 's/android:launchMode="singleTask"/android:launchMode="singleTask" android:windowSoftInputMode="adjustResize"/' android/app/src/main/AndroidManifest.xml
      - name: Icone
        working-directory: proj
        continue-on-error: true
        run: |
          pip install pillow
          python3 icon.py
      - name: Cle de signature
        run: mkdir -p ~/.android && cp proj/debug.keystore ~/.android/debug.keystore
      - name: Construire l'APK
        working-directory: proj/android
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Cotation.apk
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Cotation v${{ github.run_number }}
          files: proj/Cotation.apk
